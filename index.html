<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exampfad - Jura Klausuren-Simulation</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace; /* Simuliert den rohen Look offizieller Software */
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }
        textarea {
            width: 100%;
            height: 300px;
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #999;
            resize: none;
        }
        .status-box {
            background: #eef;
            padding: 10px;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
    <!-- WebLLM vorbereitet via CDN laden -->
    <script type="module">
        import * as webllm from "https://esm.run";
        console.log("WebLLM erfolgreich via CDN für WebGPU-Nutzung registriert.");
    </script>
</head>
<body>

<div class="container">
    <h1>Exampfad // Simulationsmodus</h1>
    <p>Hier entsteht die ablenkungsfreie Simulationsumgebung für das juristische Staatsexamen.</p>
    
    <div class="status-box">
        <strong>Fokus-Tracker (Test):</strong> <span id="focus-status">Aktiv am Schreiben</span><br>
        <strong>Ablenkungen in dieser Session:</strong> <span id="distraction-count">0</span>
    </div>

    <textarea placeholder="Beginnen Sie hier mit Ihrem Gutachten (Obersatz, Definition, Subsumtion, Ergebnis)..."></textarea>
</div>

<script>
    // Minimalistischer Proof of Concept für den Fokus-Tracker
    let distractionCount = 0;
    
    document.addEventListener("visibilitychange", () => {
        const statusEl = document.getElementById("focus-status");
        const countEl = document.getElementById("distraction-count");
        
        if (document.hidden) {
            distractionCount++;
            countEl.textContent = distractionCount;
            statusEl.textContent = "ABGELENKT! (Tab gewechselt / minimiert)";
            statusEl.style.color = "red";
            
            // Hier würde nach x Sekunden die Kamera anspringen oder der Mollie-Link triggern
        } else {
            statusEl.textContent = "Aktiv am Schreiben";
            statusEl.style.color = "green";
        }
    });
</script>

</body>
</html>
